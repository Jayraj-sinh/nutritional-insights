# Task 2 (step 5) + Task 3: simulated cloud deployment with Docker Compose
#   docker compose up --build
services:
  azurite:                      # simulated Azure Blob Storage
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"

  diet-analysis:                # Task 1/2: batch analysis container
    build: .
    image: diet-analysis
    volumes:
      - ./outputs:/app/outputs

  serverless-function:          # Task 3: simulated Azure Function
    build: .
    image: diet-analysis
    depends_on:
      - azurite
    environment:
      # inside Compose, Azurite is reachable by its service name, not 127.0.0.1
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    command: sh -c "sleep 5 && python lambda_function.py --upload data/All_Diets.csv"
    volumes:
      - ./simulated_nosql:/app/simulated_nosql
