# Task 4 - CI/CD pipeline: test -> build -> push -> simulated deployment
name: CI/CD - Nutritional Insights

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: diet-analysis

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint (syntax errors / undefined names fail the build)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run unit tests
        run: pytest -v tests/

  integration:
    name: Serverless function vs Azurite
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start Azurite (simulated Blob Storage)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          sleep 5
      - name: Upload CSV and run function
        run: |
          date
          python lambda_function.py --upload data/All_Diets.csv
          cat simulated_nosql/results.json | head -40

  build-and-deploy:
    name: Build, push & simulated deploy
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Simulated deployment - run the container
        run: |
          date
          mkdir -p outputs
          docker run --rm -v "$PWD/outputs:/app/outputs" ${{ env.IMAGE_NAME }}:latest
          ls -l outputs

      - name: Upload charts as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE:latest
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
